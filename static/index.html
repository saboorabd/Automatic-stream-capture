<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Capture Player</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body {
margin: 0;
padding: 16px;
background: #0b0b0f;
color: #e8e8ee;
font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.wrap { max-width: 960px; margin: 0 auto; }
h1 { font-size: 1.3rem; margin: 0 0 12px; }
h2 { font-size: 1rem; margin: 16px 0 6px; color: #9a9aa8; font-weight: 500; }
form { display: flex; gap: 8px; margin-bottom: 8px; }
input {
flex: 1;
min-width: 0;
padding: 12px;
border-radius: 8px;
border: 1px solid #333;
background: #1b1b1b;
color: #eee;
font-size: 15px;
}
button {
padding: 12px 18px;
border: 0;
border-radius: 8px;
background: #3b82f6;
color: #fff;
font-size: 15px;
cursor: pointer;
}
video {
width: 100%;
aspect-ratio: 16 / 9;
background: #000;
border-radius: 8px;
margin-top: 12px;
}
#msg, #status {
margin-top: 10px;
font-size: 14px;
color: #9a9aa8;
min-height: 1.2em;
word-break: break-all;
}
#msg.error, #status.error { color: #ff6b6b; }
#msg.ok, #status.ok { color: #6bd98a; }
</style>
</head>
<body>
<div class="wrap">
<h1>Stream Capture Player</h1>

<h2>Option 1: page URL (auto-capture)</h2>
<form id="pageForm">
<input id="pageUrl" type="url" placeholder="Paste the page URL here">
<button type="submit">Capture</button>
</form>

<h2>Option 2: direct .m3u8 URL</h2>
<form id="streamForm">
<input id="streamUrl" type="url" placeholder="Paste the .m3u8 link here">
<button type="submit">Play</button>
</form>

<div id="msg"></div>
<video id="player" controls autoplay muted playsinline></video>
<div id="status">Waiting for a stream…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
(() => {
'use strict';

const POLL_MS = 5000;
const video = document.getElementById('player');
const pageForm = document.getElementById('pageForm');
const streamForm = document.getElementById('streamForm');
const pageInput = document.getElementById('pageUrl');
const streamInput = document.getElementById('streamUrl');
const msgEl = document.getElementById('msg');
const statusEl = document.getElementById('status');

let hls = null;
let currentStream = null;

function setText(el, text, kind = '') {
el.textContent = text;
el.className = kind;
}

function playStream(proxyUrl) {
if (hls) { hls.destroy(); hls = null; }
if (window.Hls && Hls.isSupported()) {
hls = new Hls({ enableWorker: true, maxBufferLength: 30 });
hls.loadSource(proxyUrl);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
hls.on(Hls.Events.ERROR, (_e, data) => {
if (data.fatal) setText(statusEl, Player error: ${data.type} / ${data.details}, 'error');
});
} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
video.src = proxyUrl; // Native HLS (iOS Safari).
video.play().catch(() => {});
} else {
setText(statusEl, 'This browser cannot play HLS.', 'error');
}
}

async function pollStream() {
try {
const res = await fetch(/api/stream?t=${Date.now()}`, { cache: 'no-store' });
if (res.status === 404) return;
const data = await res.json();
if (data.url && data.url !== currentStream) {
currentStream = data.url;
setText(statusEl, 'Stream found, playing…', 'ok');
playStream(data.proxy_url);
}
} catch (_) {
setText(statusEl, 'Server unreachable, retrying…', 'error');
}
}

async function pollStatus() {
if (currentStream) return;
try {
const res = await fetch(/api/status?t=${Date.now()}, { cache: 'no-store' }); const data = await res.json(); const err = data.last_error ? —  {data.stage.name})${err});
} catch (_) { /* ignore */ }
}

async function send(body) {
setText(msgEl, 'Sending…');
const res = await fetch('/api/target', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(body),
});
const data = await res.json();
if (!res.ok) throw new Error(data.error || HTTP${res.status}`);
currentStream = null;
return data;
}

pageForm.addEventListener('submit', async (event) => {
event.preventDefault();
try {
await send({ page_url: pageInput.value.trim() });
setText(msgEl, 'Capture started. This takes about a minute.', 'ok');
} catch (err) {
setText(msgEl, Failed: ${err.message}`, 'error');
}
});

streamForm.addEventListener('submit', async (event) => {
event.preventDefault();
try {
await send({ stream_url: streamInput.value.trim() });
setText(msgEl, 'Stream set.', 'ok');
} catch (err) {
setText(msgEl, Failed:${err.message}`, 'error');
}
});

pollStream();
pollStatus();
setInterval(pollStream, POLL_MS);
setInterval(pollStatus, POLL_MS);
})();
</script>
</body>
</html>
