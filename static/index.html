<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://automatic-stream-capture.onrender.com" crossorigin>
<title>Stream</title>
<style>
  :root {
    --bg: #0a0d14; --panel: #121826; --line: #1f2a40; --text: #e9eef8; --mute: #8592b0;
    --accent: #7c9cff; --ok: #34d399; --warn: #fbbf24; --err: #f87171; --live: #e11d48;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; max-width: 1100px; width: 100%; margin: 0 auto;
  }
  .brand { font-weight: 700; letter-spacing: .02em; }
  .pill {
    font-size: 12px; padding: 5px 11px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); color: var(--mute);
  }
  .pill.ok { color: var(--ok); border-color: #1d4d3e; }
  .pill.warn { color: var(--warn); border-color: #4d3f1d; }
  .pill.err { color: var(--err); border-color: #4d2222; }
  main { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 12px; }
  .bar { height: 3px; margin: 0 0 10px; background: #1a2338; border-radius: 3px; overflow: hidden; }
  .bar i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--accent), #b08cff); transition: width .5s ease;
  }
  .stage {
    position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000;
    border-radius: 14px; overflow: hidden; border: 1px solid var(--line);
    touch-action: manipulation;
  }
  video { width: 100%; height: 100%; display: block; background: #000; }
  .overlay {
    position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center;
    background: radial-gradient(circle at 50% 40%, #16203a, #000 75%);
    pointer-events: none;
  }
  .overlay.hide { display: none; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid #26324f; border-top-color: var(--accent);
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { max-width: 460px; font-size: 14px; color: var(--mute); word-break: break-word; }
  .msg.err { color: var(--err); }

  /* Controls: shown on tap, hidden again while playing. Tapping the video never pauses it. */
  .ctrl {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    display: flex; align-items: center; gap: 8px; padding: 26px 10px 8px;
    background: linear-gradient(transparent, rgba(0,0,0,.85));
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .stage.show-ctrl .ctrl { opacity: 1; pointer-events: auto; }
  .ctrl button {
    background: transparent; color: #fff; border: 0; font-size: 18px;
    padding: 4px 8px; border-radius: 8px; cursor: pointer;
  }
  .seek { flex: 1; min-width: 0; accent-color: var(--accent); }
  .time { font-size: 13px; color: #fff; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .live {
    font-size: 12px; font-weight: 700; color: #fff; background: var(--live);
    padding: 3px 9px; border-radius: 6px; letter-spacing: .08em;
  }
  .golive {
    font-size: 12px; color: #fff; border: 1px solid #fff; border-radius: 8px; padding: 3px 8px;
  }
  .hide { display: none !important; }
  select {
    background: rgba(18,24,38,.9); color: #fff; border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 6px; font-size: 13px;
  }

  .dock { margin-top: auto; padding: 14px 12px 18px; background: linear-gradient(180deg, transparent, var(--bg) 35%); }
  form { display: flex; gap: 8px; max-width: 1100px; margin: 0 auto; }
  input {
    flex: 1; min-width: 0; padding: 14px 16px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    font-size: 16px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button.go {
    padding: 0 22px; border: 0; border-radius: 14px; cursor: pointer;
    background: var(--accent); color: #06101f; font-weight: 700; font-size: 15px;
  }
  button.go:disabled { opacity: .5; }
  .tools {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin: 10px auto 0; max-width: 1100px; min-height: 30px;
  }
  .ghost {
    background: transparent; border: 1px solid var(--line); color: var(--mute);
    font-weight: 500; font-size: 13px; padding: 8px 12px; border-radius: 10px; cursor: pointer;
  }
  .toast {
    position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%);
    background: #1a2540; border: 1px solid var(--line); padding: 9px 14px; border-radius: 10px;
    font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <header>
    <div class="brand">Stream</div>
    <span id="pill" class="pill">Connecting</span>
  </header>

  <main>
    <div class="bar"><i id="progress"></i></div>
    <div id="stage" class="stage">
      <video id="v" playsinline muted autoplay></video>

      <div id="overlay" class="overlay">
        <div id="spin" class="spinner"></div>
        <div id="msg" class="msg">Connecting…</div>
      </div>

      <div class="ctrl">
        <button id="play" type="button" aria-label="Play or pause">▶</button>
        <input id="seek" class="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <span id="live" class="live hide">LIVE</span>
        <button id="golive" class="golive hide" type="button">Go live</button>
        <span id="time" class="time">0:00 / 0:00</span>
        <button id="mute" type="button" aria-label="Sound">🔇</button>
        <select id="quality" aria-label="Quality"><option value="-1">Auto</option></select>
        <button id="fs" type="button" aria-label="Fullscreen">⛶</button>
      </div>
    </div>
  </main>

  <div class="dock">
    <form id="form" autocomplete="off">
      <input id="src" type="text" inputmode="url" placeholder="Page URL or .m3u8 link" required>
      <button id="go" class="go" type="submit">Go</button>
    </form>
    <div class="tools">
      <button id="copy" class="ghost" type="button">Copy stream link</button>
      <span id="age" class="pill hide"></span>
    </div>
  </div>

  <div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
(() => {
  'use strict';

  // Server address. On GitHub Pages it points to Render; on Render it stays same-origin.
  const API = location.hostname.endsWith('github.io')
    ? 'https://automatic-stream-capture.onrender.com'
    : '';

  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  const video = $('v');
  const overlay = $('overlay');
  const msg = $('msg');
  const spin = $('spin');
  const pill = $('pill');
  const bar = $('progress');
  const form = $('form');
  const src = $('src');
  const go = $('go');
  const copyBtn = $('copy');
  const age = $('age');
  const toast = $('toast');
  const playBtn = $('play');
  const seek = $('seek');
  const liveEl = $('live');
  const goLiveBtn = $('golive');
  const timeEl = $('time');
  const muteBtn = $('mute');
  const qualitySel = $('quality');
  const fsBtn = $('fs');

  const M3U8 = /\.m3u8(\?|#|$)/i;
  const LAST_KEY = 'stream:last';
  const BAD_KEY = 'stream:badhosts';
  const LAST_MAX_AGE_MS = 6 * 60 * 60 * 1000;
  const KEEPALIVE_MS = 4 * 60 * 1000;
  const CTRL_HIDE_MS = 3000;
  const PROGRESS = {
    launching_chrome: 10, chrome_started: 25, opening_page: 40,
    page_loaded: 55, waiting_for_stream: 70, stream_found: 95,
  };
  const LABELS = {
    launching_chrome: 'Starting browser…',
    chrome_started: 'Browser ready',
    opening_page: 'Opening page…',
    page_loaded: 'Page loaded, looking for the stream…',
    waiting_for_stream: 'Waiting for the stream…',
    stream_found: 'Stream found, loading…',
  };

  let hls = null;
  let rawUrl = null;
  let proxyUrl = null;
  let usingProxy = false;
  let fragOk = false;
  let netRetries = 0;
  let statusTick = 0;
  let seeking = false;
  let isLive = false;
  let hideTimer = null;

  // ---------- helpers ----------
  function toastMsg(text) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastMsg.t);
    toastMsg.t = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  function setPill(kind, text) {
    pill.className = 'pill ' + kind;
    pill.textContent = text;
  }

  function showOverlay(text, isError = false) {
    overlay.classList.remove('hide');
    msg.textContent = text;
    msg.className = 'msg' + (isError ? ' err' : '');
    spin.style.display = isError ? 'none' : 'block';
  }

  function hideOverlay() { overlay.classList.add('hide'); }

  function ago(iso) {
    const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
    if (s < 60) return `${Math.floor(s)}s ago`;
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    return `${Math.floor(s / 3600)}h ago`;
  }

  function explain(text) {
    try {
      const d = JSON.parse(text);
      return d.diagnosis || text;
    } catch (_) {
      return text || 'No stream found.';
    }
  }

  function fmt(sec) {
    if (!isFinite(sec) || sec < 0) return '0:00';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    const mm = h ? String(m).padStart(2, '0') : String(m);
    return (h ? h + ':' : '') + mm + ':' + String(s).padStart(2, '0');
  }

  function readJSON(key, fallback) {
    try {
      const v = JSON.parse(localStorage.getItem(key));
      return v === null || v === undefined ? fallback : v;
    } catch (_) { return fallback; }
  }

  function writeJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) { /* storage blocked */ }
  }

  function hostOf(url) {
    try { return new URL(url).host; } catch (_) { return ''; }
  }

  function directBlocked(url) {
    return readJSON(BAD_KEY, []).includes(hostOf(url));
  }

  function markDirectBlocked(url) {
    const host = hostOf(url);
    const list = readJSON(BAD_KEY, []);
    if (host && !list.includes(host)) {
      list.push(host);
      writeJSON(BAD_KEY, list.slice(-20));
    }
  }

  function saveLast(url, proxy) {
    writeJSON(LAST_KEY, { url, proxy, t: Date.now() });
  }

  function loadLast() {
    const v = readJSON(LAST_KEY, null);
    if (v && v.url && Date.now() - v.t < LAST_MAX_AGE_MS) return v;
    return null;
  }

  // ---------- controls (show on tap, hide while playing) ----------
  function showControls() {
    stage.classList.add('show-ctrl');
    clearTimeout(hideTimer);
    if (!video.paused) {
      hideTimer = setTimeout(() => stage.classList.remove('show-ctrl'), CTRL_HIDE_MS);
    }
  }

  // Tapping the picture only toggles the controls. It never pauses playback.
  stage.addEventListener('click', (e) => {
    if (e.target.closest('.ctrl')) return;
    if (stage.classList.contains('show-ctrl')) stage.classList.remove('show-ctrl');
    else showControls();
  });

  function setLive(live) {
    isLive = live;
    liveEl.classList.toggle('hide', !live);
    goLiveBtn.classList.toggle('hide', !live);
    seek.classList.toggle('hide', live);
    timeEl.classList.toggle('hide', live);
  }

  function updateTime() {
    const d = video.duration;
    if (d === Infinity) { setLive(true); return; }
    if (!isFinite(d)) return;
    if (!isLive) {
      timeEl.textContent = `${fmt(video.currentTime)} / ${fmt(d)}`;
      if (!seeking) seek.value = String(Math.round((video.currentTime / d) * 1000));
    }
  }

  function fillQuality(inst) {
    qualitySel.innerHTML = '';
    const add = (value, label) => {
      const o = document.createElement('option');
      o.value = value;
      o.textContent = label;
      qualitySel.appendChild(o);
    };
    add('-1', 'Auto');

    // One entry per resolution. If a resolution has several bitrates, keep the highest.
    const best = new Map();
    inst.levels.forEach((lvl, idx) => {
      if (!lvl.height) return;
      const cur = best.get(lvl.height);
      if (cur === undefined || (lvl.bitrate || 0) > (inst.levels[cur].bitrate || 0)) best.set(lvl.height, idx);
    });
    [...best.keys()].sort((a, b) => b - a).forEach((h) => add(String(best.get(h)), h + 'p'));
    qualitySel.value = '-1';
  }

  qualitySel.addEventListener('change', () => {
    if (hls) hls.currentLevel = Number(qualitySel.value); // -1 = Auto.
  });

  playBtn.addEventListener('click', () => {
    if (video.paused) video.play().catch(() => {});
    else video.pause();
  });

  goLiveBtn.addEventListener('click', () => {
    if (hls && hls.liveSyncPosition) video.currentTime = hls.liveSyncPosition;
    else if (isFinite(video.duration)) video.currentTime = video.duration;
    video.play().catch(() => {});
    toastMsg('Live');
  });

  video.addEventListener('play', () => { playBtn.textContent = '❚❚'; showControls(); });
  video.addEventListener('pause', () => { playBtn.textContent = '▶'; showControls(); });
  video.addEventListener('timeupdate', updateTime);
  video.addEventListener('durationchange', updateTime);

  seek.addEventListener('input', () => { seeking = true; });
  seek.addEventListener('change', () => {
    const d = video.duration;
    if (isFinite(d)) video.currentTime = (Number(seek.value) / 1000) * d;
    seeking = false;
  });

  muteBtn.addEventListener('click', () => {
    video.muted = !video.muted;
    muteBtn.textContent = video.muted ? '🔇' : '🔊';
  });

  // Fullscreen only from this button. Tapping the video never triggers it, so the screen does not rotate by accident.
  fsBtn.addEventListener('click', () => {
    if (stage.requestFullscreen) stage.requestFullscreen().catch(() => {});
    else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen(); // iPhone
  });

  // ---------- playback ----------
  function onHlsError(_e, d) {
    if (!d.fatal) return;

    if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
      if (!usingProxy && proxyUrl) {
        if (!fragOk) markDirectBlocked(rawUrl);
        usingProxy = true;
        fragOk = false;
        netRetries = 0;
        hls.loadSource(proxyUrl);
        return;
      }
      netRetries += 1;
      if (netRetries > 5) {
        rawUrl = null;
        netRetries = 0;
        showOverlay('Reconnecting to a fresh stream…');
        return;
      }
      hls.startLoad();
    } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) {
      hls.recoverMediaError();
    } else {
      showOverlay('Player error: ' + d.details, true);
    }
  }

  function createHls() {
    hls = new Hls({
      enableWorker: true,
      capLevelToPlayerSize: true,
      startFragPrefetch: true,
      maxBufferLength: 10,
      backBufferLength: 20,
    });
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      fillQuality(hls);
      video.play().catch(() => {});
    });
    hls.on(Hls.Events.LEVEL_LOADED, (_e, data) => setLive(!!data.details.live));
    hls.on(Hls.Events.FRAG_LOADED, () => { fragOk = true; netRetries = 0; });
    hls.on(Hls.Events.ERROR, onHlsError);
  }

  function attach(url) {
    const hasHls = window.Hls && Hls.isSupported();
    qualitySel.classList.toggle('hide', !hasHls);

    if (hasHls) {
      if (!hls) createHls();
      usingProxy = !!proxyUrl && directBlocked(url);
      fragOk = false;
      netRetries = 0;
      hls.loadSource(usingProxy ? proxyUrl : url);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = proxyUrl || url;
      video.play().catch(() => {});
    } else {
      showOverlay('This browser cannot play HLS.', true);
    }
  }

  function playStream(url, proxy) {
    rawUrl = url;
    proxyUrl = proxy && !proxy.startsWith('http') ? API + proxy : proxy;
    hideOverlay();
    setPill('ok', 'Live');
    attach(url);
    saveLast(url, proxyUrl);
  }

  // ---------- server sync ----------
  async function keepAlive() {
    try {
      await fetch(API + '/api/status?ka=' + Date.now(), { cache: 'no-store' });
    } catch (_) { /* offline or server asleep */ }
  }

  async function checkStream() {
    try {
      const res = await fetch(API + '/api/stream?t=' + Date.now(), { cache: 'no-store' });
      if (res.status === 404) return;
      const data = await res.json();

      if (data.updated_at) {
        age.textContent = 'updated ' + ago(data.updated_at);
        age.classList.remove('hide');
      }
      if (data.url && data.url !== rawUrl) playStream(data.url, data.proxy_url);
    } catch (_) { /* server waking up; next tick retries */ }
  }

  async function checkStatus() {
    try {
      const res = await fetch(API + '/api/status?t=' + Date.now(), { cache: 'no-store' });
      const s = await res.json();
      const name = (s.stage && s.stage.name) || 'idle';

      if (rawUrl) return;

      if (LABELS[name]) {
        setPill('warn', 'Capturing');
        bar.style.width = PROGRESS[name] + '%';
        showOverlay(LABELS[name]);
      } else if (name === 'timeout_no_stream') {
        setPill('err', 'No stream');
        bar.style.width = '0%';
        showOverlay(explain(s.stage.error), true);
      } else if (s.page_url) {
        setPill('', 'Idle');
        showOverlay(s.last_error ? explain(s.last_error) : 'Waiting for the next capture…');
      } else {
        setPill('', 'Ready');
        showOverlay('Paste a page or .m3u8 link below.');
      }
    } catch (_) {
      if (!rawUrl) {
        setPill('warn', 'Waking server');
        showOverlay('Server is waking up (free plan, can take a minute)…');
      }
    }
  }

  // ---------- user input ----------
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const value = src.value.trim();
    if (!value) return;

    const isStream = M3U8.test(value);
    const body = isStream ? { stream_url: value } : { page_url: value };

    go.disabled = true;
    try {
      const res = await fetch(API + '/api/target', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

      rawUrl = null;
      proxyUrl = null;
      src.value = '';
      bar.style.width = '5%';
      setPill('warn', isStream ? 'Loading' : 'Capturing');
      showOverlay(isStream ? 'Loading stream…' : 'Starting capture…');
      toastMsg(isStream ? 'Stream set' : 'Capture started');
      checkStream();
    } catch (err) {
      toastMsg('Failed: ' + err.message);
    } finally {
      go.disabled = false;
    }
  });

  copyBtn.addEventListener('click', async () => {
    if (!proxyUrl) return toastMsg('No stream yet');
    const link = proxyUrl.startsWith('http') ? proxyUrl : location.origin + proxyUrl;
    try {
      await navigator.clipboard.writeText(link);
      toastMsg('Stream link copied');
    } catch (_) {
      toastMsg('Copy failed');
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      keepAlive();
      checkStream();
      checkStatus();
    }
  });

  // ---------- start ----------
  const last = loadLast();
  if (last) playStream(last.url, last.proxy);

  keepAlive();
  checkStream();
  checkStatus();
  setInterval(keepAlive, KEEPALIVE_MS);
  setInterval(() => {
    checkStream();
    statusTick += 2;
    if (!rawUrl || statusTick >= 15) {
      statusTick = 0;
      checkStatus();
    }
  }, 2000);
})();
</script>
</body>
</html>
