name: keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render (waits for cold start)
        run: curl -s -o /dev/null -w "%{http_code}\n" --max-time 90 https://automatic-stream-capture.onrender.com/api/status
